<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Focus Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Animated Background Elements -->
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>

        <main class="glass-card">
            <header>
                <h1>Focus Time</h1>
                <div class="header-actions">
                <button id="ai-btn" class="icon-btn" aria-label="AI 任務拆解" title="AI 任務拆解（Claude / Gemini）">✨</button>
                <button id="settings-btn" class="icon-btn" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                </div>
            </header>

            <p id="current-task" class="current-task"></p>

            <nav class="mode-selector">
                <button class="mode-btn active" data-mode="pomodoro">Pomodoro</button>
                <button class="mode-btn" data-mode="shortBreak">Short Break</button>
                <button class="mode-btn" data-mode="longBreak">Long Break</button>
            </nav>

            <div class="timer-display">
                <svg class="progress-ring" width="300" height="300">
                    <circle
                        class="progress-ring__background"
                        stroke-width="8"
                        fill="transparent"
                        r="140"
                        cx="150"
                        cy="150"
                    />
                    <circle
                        class="progress-ring__circle"
                        stroke-width="8"
                        fill="transparent"
                        r="140"
                        cx="150"
                        cy="150"
                    />
                </svg>
                <div class="time-text">
                    <span id="time-left">25:00</span>
                    <span id="status-text">Ready to focus?</span>
                </div>
            </div>

            <div class="controls">
                <button id="start-btn" class="control-btn primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-play"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <span>Start</span>
                </button>
                <button id="reset-btn" class="control-btn secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-reset"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                    <span>Reset</span>
                </button>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-content glass-card">
            <h2>Settings</h2>
            <div class="setting-group">
                <label for="pomodoro-time">Pomodoro (minutes)</label>
                <input type="number" id="pomodoro-time" min="1" max="90" value="25">
            </div>
            <div class="setting-group">
                <label for="short-break-time">Short Break (minutes)</label>
                <input type="number" id="short-break-time" min="1" max="30" value="5">
            </div>
            <div class="setting-group">
                <label for="long-break-time">Long Break (minutes)</label>
                <input type="number" id="long-break-time" min="1" max="60" value="15">
            </div>
            <h3 class="settings-subtitle">AI（Claude / Gemini）</h3>
            <div class="setting-group stacked">
                <label for="claude-key">Claude API key</label>
                <input type="password" id="claude-key" placeholder="sk-ant-..." autocomplete="off">
            </div>
            <div class="setting-group stacked">
                <label for="claude-model">Claude 模型</label>
                <input type="text" id="claude-model" placeholder="claude-opus-5-5">
            </div>
            <div class="setting-group stacked">
                <label for="gemini-key">Gemini API key</label>
                <input type="password" id="gemini-key" placeholder="AIza..." autocomplete="off">
            </div>
            <div class="setting-group stacked">
                <label for="gemini-model">Gemini 模型</label>
                <input type="text" id="gemini-model" placeholder="gemini-3.8-flash">
            </div>
            <p class="settings-note">金鑰只存在這台瀏覽器（localStorage），直接從瀏覽器呼叫 API。請勿在公開網站上使用你的金鑰。</p>
            <div class="modal-actions">
                <button id="close-settings-btn" class="control-btn secondary">Cancel</button>
                <button id="save-settings-btn" class="control-btn primary">Save</button>
            </div>
        </div>
    </div>
    <!-- AI Modal -->
    <div id="ai-modal" class="modal-overlay hidden">
        <div class="modal-content glass-card ai-modal">
            <h2>✨ AI 任務拆解</h2>
            <textarea id="ai-task" rows="3" placeholder="你想完成什麼？例如：寫完期末報告的文獻回顧"></textarea>
            <div class="setting-group">
                <label for="ai-provider">使用模型</label>
                <select id="ai-provider">
                    <option value="both">Claude + Gemini 並排</option>
                    <option value="claude">只用 Claude</option>
                    <option value="gemini">只用 Gemini</option>
                </select>
            </div>
            <div id="ai-results" class="ai-results"></div>
            <div class="modal-actions">
                <button id="ai-close-btn" class="control-btn secondary">關閉</button>
                <button id="ai-run-btn" class="control-btn primary">產生計畫</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="ai.js"></script>
</body>
</html>
